name: iosApp
options:
  bundleIdPrefix: com.maxrave.simpmusic
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [iosApp]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        ENABLE_BITCODE: NO
        FRAMEWORK_SEARCH_PATHS: 
          - $(inherited)
          - "${SRCROOT}/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    preBuildScripts:
      - name: Compile Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    dependencies:
      - framework: ../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/ComposeApp.framework
        embed: true
