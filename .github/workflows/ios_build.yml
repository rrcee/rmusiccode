name: Build iOS IPA

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd rmusic-code/iosApp
          xcodegen generate

      - name: Build unsigned .app
        run: |
          cd rmusic-code/iosApp
          xcodebuild build \
            -project SimpMusic.xcodeproj \
            -scheme SimpMusic \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=../../build/ios

      - name: Package into IPA
        run: |
          cd build/ios
          mkdir -p Payload
          mv SimpMusic.app Payload/
          zip -r SimpMusic.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-iOS
          path: build/ios/SimpMusic.ipa
